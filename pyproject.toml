[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-emulator"
version = "0.2.0"
description = "Emulator of joint access-link and broker congestion pricing (arXiv:2602.03246)"
readme = "README.md"
authors = [{name = "Alan Ma"}]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "pyyaml", "matplotlib", "streamlit", "plotly"]

[project.scripts]
traffic-emulator = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
