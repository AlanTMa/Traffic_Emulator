name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v

  docker-smoke:
    # 1 controller, 3 broker and 5 source containers for 40 s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the 5x3 emulator in containers
        run: python -m src.cli up --backend docker --no-dashboard --duration 40 --window 2 --output-dir runs/ci
      - name: Verify against the in-process algorithm
        run: python -m scripts.verify_distributed_run runs/ci
