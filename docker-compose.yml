# Started by `python -m src.cli up`, which sets TE_CONFIG and TE_OUTPUT_DIR:
#   docker compose --profile distributed up --build --scale source=N --scale broker=M
# Single-process emulator: docker compose --profile reference up --build

x-app: &app
  build: .
  image: traffic-emulator:latest
  volumes:
    - ./runs:/app/runs            # telemetry
    - ./config:/app/config:ro
  environment:
    PYTHONUNBUFFERED: "1"
  stop_grace_period: 15s

services:
  controller:
    <<: *app
    profiles: [distributed]
    command: ["python", "-m", "src.distributed.controller",
              "--config", "${TE_CONFIG:-config/paper_5x3.yaml}",
              "--output-dir", "${TE_OUTPUT_DIR:-runs/latest}",
              "--host", "0.0.0.0", "--port", "7000"]
    environment:
      PYTHONUNBUFFERED: "1"
      TE_DURATION: ${TE_DURATION:-}       # empty: run until stopped
      TE_GIT_SHA: ${TE_GIT_SHA:-}         # the image has no .git
      TE_GIT_DIRTY: ${TE_GIT_DIRTY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 7000), 2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30

  broker:
    <<: *app
    profiles: [distributed]
    # --scale broker=M; each advertises its container IP for the data plane
    command: ["python", "-m", "src.distributed.broker", "--controller", "controller:7000", "--port", "7100"]
    depends_on:
      controller:
        condition: service_healthy

  source:
    <<: *app
    profiles: [distributed]
    # --scale source=N
    command: ["python", "-m", "src.distributed.source", "--controller", "controller:7000"]
    depends_on:
      controller:
        condition: service_healthy

  dashboard:
    <<: *app
    profiles: [distributed, reference]
    command: ["python", "-m", "streamlit", "run", "src/dashboard/app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "${TE_DASHBOARD_PORT:-8501}:8501"
    environment:
      PYTHONUNBUFFERED: "1"
      TRAFFIC_EMULATOR_OUTPUT_DIR: /app/${TE_OUTPUT_DIR:-runs/latest}
      TRAFFIC_EMULATOR_OBSERVER: "1"      # read-only

  emulator:
    <<: *app
    profiles: [reference]
    command: ["python", "-m", "src.cli", "run", "--config", "${TE_CONFIG:-config/paper_5x3.yaml}",
              "--output-dir", "${TE_OUTPUT_DIR:-runs/latest}"]
