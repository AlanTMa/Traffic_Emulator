# The paper's 5x3 instance (notebook seed 42), set up for the notebook's windowed experiment.
simulation:
  # duration: 300 reproduces the notebook's 300 s run; without it, runs until stopped
  window: 5
  warmup: 4       # windows before the splits start adapting
  controller_mode: "windowed_stochastic"

algorithm:
  gamma: 0.5      # price smoothing
  eta: 0.35       # split inertia
  beta: 0.3       # EWMA smoothing of measured broker arrival rates
  eps: 1e-8
  convergence_tol: 1e-10

topology:
  # MB/s as in the notebook; one work unit = 1 MB
  sources:
    - {id: "P0", rate: 0.15625}
    - {id: "P1", rate: 0.09765625}
    - {id: "P2", rate: 30.05859375}
    - {id: "P3", rate: 30.009765625}
    - {id: "P4", rate: 0.107421875}
  brokers:
    - {id: "SN1", capacity: 160.75448519014384}
    - {id: "SN2", capacity: 106.50515929852796}
    - {id: "SN3", capacity: 196.56320330745592}
