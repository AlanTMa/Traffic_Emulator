# Baseline 5x3 Experiment from Paper
# Windowed stochastic simulation of the distributed pricing scheme
# (notebook: SIM_DURATION_SEC, TIME_WINDOW, WARMUP_WINDOWS, ETA_SPLIT,
# GAMMA_PRICE, BETA_LAMBDA)
simulation:
  # No duration: runs until stopped. The notebook ran 300s (60 windows);
  # add "duration: 300" to reproduce exactly that.
  window: 5       # seconds per window; one price + routing update each
  warmup: 4       # windows before sources start adapting their splits
  controller_mode: "windowed_stochastic"

algorithm:
  gamma: 0.5      # price smoothing
  eta: 0.35       # split inertia
  beta: 0.3       # EWMA smoothing of measured broker arrival rates
  eps: 1e-8
  convergence_tol: 1e-10

topology:
  # Exact seed-42 instance from the reference notebook (cells 0-2), MB/s.
  # Rates: sum over topics of msg/s x size, / 1024 (e.g. P2 = 30780/1024).
  sources:
    - {id: "P0", rate: 0.15625}
    - {id: "P1", rate: 0.09765625}
    - {id: "P2", rate: 30.05859375}
    - {id: "P3", rate: 30.009765625}
    - {id: "P4", rate: 0.107421875}
  brokers:
    - {id: "SN1", capacity: 160.75448519014384}
    - {id: "SN2", capacity: 106.50515929852796}
    - {id: "SN3", capacity: 196.56320330745592}
  access_capacities:
