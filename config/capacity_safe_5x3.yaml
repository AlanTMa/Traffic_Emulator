# Capacity-safe event-driven mode on the exact 5x3 baseline: event-driven
# access/broker queues, with the planned routing advanced by one exact
# Algorithm 1 step per window (the step static_algorithm1 uses).
simulation:
  # No duration: runs until stopped. Set e.g. "duration: 500" for 100 windows.
  window: 5       # seconds per window; one Algorithm 1 step each
  controller_mode: "capacity_safe_event_driven"

algorithm:
  eta: 0.25       # Algorithm 1 step size (paper Sec. V-A)
  gamma: 0.5      # price damping
  delta_s: 1.0e-8 # capacity margin kept by the safe step
  eps: 1.0e-12    # numerical guard only
  beta: 0.3       # EWMA of measured arrival rates: telemetry only, not control

topology:
  # Exact seed-42 instance from the reference notebook (cells 0-2), MB/s.
  # The event simulator reads these as normalized work units/s, 1 unit = 1 MB.
  # Rates: sum over topics of msg/s x size, / 1024 (e.g. P2 = 30780/1024).
  sources:
    - {id: "P0", rate: 0.15625}
    - {id: "P1", rate: 0.09765625}
    - {id: "P2", rate: 30.05859375}
    - {id: "P3", rate: 30.009765625}
    - {id: "P4", rate: 0.107421875}
  brokers:
    - {id: "SN1", capacity: 160.75448519014384}
    - {id: "SN2", capacity: 106.50515929852796}
    - {id: "SN3", capacity: 196.56320330745592}
  access_capacities:
    "P0->SN1": 47.49080237694725
    "P0->SN2": 54.6398788362281
    "P0->SN3": 43.12037280884873
    "P1->SN1": 41.16167224336399
    "P1->SN2": 52.022300234864176
    "P1->SN3": 40.41168988591605
    "P2->SN1": 56.648852816008436
    "P2->SN2": 43.63649934414201
    "P2->SN3": 46.08484485919075
    "P3->SN1": 48.638900372842315
    "P3->SN2": 52.23705789444759
    "P3->SN3": 45.84289297070436
    "P4->SN1": 49.121399684340716
