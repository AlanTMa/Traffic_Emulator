# Static distributed solver on the 5x3 baseline (no packets): reproduces the
# notebook's convergence plots (dashboard_*.png). One iteration per window.
simulation:
  duration: 100   # 100 iterations at window=1s
  window: 1
  controller_mode: "static_algorithm1"

algorithm:
  gamma: 0.5
  eta: 0.25
  delta_s: 1.0e-8   # capacity margin kept by the safe step (paper / notebook)
  eps: 1.0e-12      # numerical guard against division by zero

topology:
  # Exact seed-42 instance from the reference notebook (cells 0-2), MB/s.
  # Rates: sum over topics of msg/s x size, / 1024 (e.g. P2 = 30780/1024).
  sources:
    - {id: "P0", rate: 0.15625}
    - {id: "P1", rate: 0.09765625}
    - {id: "P2", rate: 30.05859375}
    - {id: "P3", rate: 30.009765625}
    - {id: "P4", rate: 0.107421875}
  brokers:
    - {id: "SN1", capacity: 160.75448519014384}
    - {id: "SN2", capacity: 106.50515929852796}
    - {id: "SN3", capacity: 196.56320330745592}
  access_capacities:
    "P0->SN1": 47.49080237694725
    "P0->SN2": 54.6398788362281
    "P0->SN3": 43.12037280884873
    "P1->SN1": 41.16167224336399
    "P1->SN2": 52.022300234864176
    "P1->SN3": 40.41168988591605
    "P2->SN1": 56.648852816008436
    "P2->SN2": 43.63649934414201
    "P2->SN3": 46.08484485919075
    "P3->SN1": 48.638900372842315
    "P3->SN2": 52.23705789444759
    "P3->SN3": 45.84289297070436
